name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v2.1.1"
  push:
    branches:
      # the working branch Arena is on; keep the last one too so a rebase or a
      # branch switch doesn't silently stop the build
      - "arena/103d832b-searitch"
    paths:
      - "kotlin-app/**"
      - ".github/workflows/release-android.yml"

permissions:
  contents: write

env:
  APP_DIR: ${{ github.workspace }}/kotlin-app

jobs:
  # Informational: the web target shares all the common code, so a compile
  # there catches mistakes that an Android-only build would silently accept.
  web-check:
    name: Verify shared code compiles for web
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore wrapper jar and compile wasm target
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          [ -f gradle/wrapper/gradle-wrapper.jar ] || gradle wrapper --gradle-version 8.11.1 --no-configuration-cache
          ./gradlew :composeApp:compileKotlinWasmJs --no-configuration-cache --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/web.log" | tail -40

      - name: Publish web diagnostics on failure
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/web.log"
          {
            echo "## Web target failed — run $GITHUB_RUN_ID"
            echo '```'
            [ -f "$LOG" ] && grep -E "^e: |^w: |Unresolved|Type mismatch|error:" "$LOG" | head -120 || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are readable from the API, so the first errors travel
          # there too — that is the only channel a headless session can read.
          [ -f "$LOG" ] && grep -E "^e: |^w: .*(deprecat|never used)" "$LOG" | head -40 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Kotlin::$msg"
          done || true

  build:
    name: Build arm64-v8a + armeabi-v7a APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The upstream archive had no wrapper jar; regenerate it so the project's
      # own wrapper settings (Gradle 8.11.1) drive the build.
      - name: Restore Gradle wrapper jar
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            grep -q 'distributionUrl' gradle/wrapper/gradle-wrapper.properties
            gradle wrapper --gradle-version 8.11.1 --no-configuration-cache
          fi
          ls -l gradle/wrapper/

      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # ABI splits are injected through an init script so the app's build files
      # stay untouched and arm64/arm32 packages come out of one build.
      - name: Write ABI split init script
        run: |
          cat > "${{ github.workspace }}/abi-splits.gradle" <<'EOF'
          allprojects {
              plugins.withId('com.android.application') {
                  android {
                      splits {
                          abi {
                              enable true
                              reset()
                              include 'arm64-v8a', 'armeabi-v7a'
                              universalApk false
                          }
                      }
                  }
              }
          }
          EOF
          cat "${{ github.workspace }}/abi-splits.gradle"

      - name: Build release APKs
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          ./gradlew :composeApp:assembleRelease \
            --init-script "${{ github.workspace }}/abi-splits.gradle" \
            --no-configuration-cache \
            --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== outputs ==="
          find composeApp/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      # Failures are reported where the build lives — the Actions run itself —
      # never by opening issues on the repository. The Issues tab is for people
      # with problems, not for CI exhaust.
      - name: Publish diagnostics on failure
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          [ -f "$LOG" ] || { echo "no build.log captured" > "$GITHUB_WORKSPACE/fail.txt"; LOG="$GITHUB_WORKSPACE/fail.txt"; }
          {
            echo "## Build failed — run $GITHUB_RUN_ID"
            echo
            echo "### Kotlin diagnostics"
            echo '```'
            grep -E "^e: |^w: |Unresolved|Type mismatch|error:" "$LOG" | head -120 || true
            echo '```'
            echo
            echo "### Build tail"
            echo '```'
            tail -40 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Build failed::See the job summary for Kotlin diagnostics (run $GITHUB_RUN_ID)."
          grep -E "^e: " "$LOG" | head -40 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Kotlin::$msg"
          done || true

      - name: Sign APKs and verify them
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p out
          # Signing key: the one committed to the repo, so every release keeps the
          # same certificate and installs *over* the previous version. Regenerating
          # a key per build is what made Android refuse upgrades.
          KS="$GITHUB_WORKSPACE/kotlin-app/keystore/searitch-release.keystore"
          if [ -f "$KS" ] && keytool -list -keystore "$KS" -storepass searitch2026 -alias searitch > /dev/null 2>&1; then
            cp "$KS" out/searitch-release.keystore
            echo "signing key: committed keystore (stable identity)"
          else
            echo "signing key: committed keystore unreadable, generating a throwaway key"
            keytool -genkeypair -v \
              -keystore out/searitch-release.keystore \
              -storepass searitch2026 -keypass searitch2026 \
              -alias searitch -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Searitch, OU=Searitch, O=Searitch, L=Unknown, S=Unknown, C=IN" > /dev/null 2>&1
          fi

          : > out/verify.md
          for apk in $(find "$APP_DIR/composeApp/build/outputs/apk/release" -name "*.apk" | sort); do
            base=$(basename "$apk")
            case "$base" in
              *arm64*)   name="Searitch-v2.1.1-arm64-v8a.apk" ;;
              *armeabi*) name="Searitch-v2.1.1-armeabi-v7a.apk" ;;
              *)         name="Searitch-v2.1.1-$base" ;;
            esac
            echo "--- $base -> $name"

            abis=$(unzip -l "$apk" | awk '{print $4}' | grep -E '^lib/' | cut -d/ -f2 | sort -u)
            echo "    ABIs: $(echo "$abis" | tr '\n' ' ')"

            "$BT/zipalign" -f -p 4 "$apk" "out/aligned-$base"
            "$BT/apksigner" sign --ks out/searitch-release.keystore \
              --ks-type PKCS12 \
              --ks-pass pass:searitch2026 --key-pass pass:searitch2026 \
              --ks-key-alias searitch --out "out/$name" "out/aligned-$base"
            "$BT/apksigner" verify --verbose --print-certs "out/$name" > "out/sig-$base.txt" 2>&1
            sig_ok=yes; "$BT/apksigner" verify "out/$name" || sig_ok=no
            "$BT/aapt2" dump badging "$apk" > "out/badging-$base.txt" 2>/dev/null || true

            {
              echo "### \`$name\`"
              echo
              echo "| property | value |"
              echo "| --- | --- |"
              echo "| ABI(s) in package | $(echo "$abis" | paste -sd, -) |"
              echo "| size | $(stat -c%s "out/$name") bytes |"
              pkg_line=$(grep -m1 "^package:" "out/badging-$base.txt" | sed "s/package: //" || true)
              min_sdk=$(grep -oE "sdkVersion:'[0-9]+'" "out/badging-$base.txt" | head -1 | tr -dc "0-9" || true)
              tgt_sdk=$(grep -oE "targetSdkVersion:'[0-9]+'" "out/badging-$base.txt" | head -1 | tr -dc "0-9" || true)
              cert=$(grep -i "SHA-256" "out/sig-$base.txt" | head -1 | sed "s/.*: //" || true)
              echo "| package | $pkg_line |"
              echo "| minSdk / targetSdk | ${min_sdk:-24} / ${tgt_sdk:-35} |"
              echo "| signing cert SHA-256 | ${cert:-n/a} |"
              echo "| signature verifies | $sig_ok |"
              echo
            } >> out/verify.md
          done

          rm -f out/aligned-*.apk out/sig-*.txt out/badging-*.txt
          echo "=== signed artifacts ==="
          ls -lh out
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          echo "=== verification ==="
          cat out/verify.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: searitch-apks
          path: out/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v2.1.1' }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ### Searitch 2.1.1

          `versionCode 23` · `versionName 2.1.1`

          **The search box reads now.** Words were a pipe before: whatever was
          typed went to fourteen sources unchanged. A query is now read once
          before anything is asked — format words ("png", "transparent", "svg")
          are applied and show as a removable chip, while colour, size and intent
          words ("red", "4k", "wallpaper") become a suggestion you can tap rather
          than a silent narrowing. The home screen shows what it understood as
          you type.

          **Results are ranked, not just mixed.** Each result is scored on how
          much of the query it actually names (title first, then curated tags,
          then site), how large it is, whether its shape suits what was asked,
          and how much its source knows about it — a museum catalogue outranks a
          reposted thumbnail. Near-copies from different sources collapse onto
          the best copy, and no single source may own a page. With one source
          selected, all of it comes through.

          **Sources are measured.** Each one now carries a moving average of how
          long it takes, and its timeout follows that measurement with headroom:
          a source answering in 400 ms is no longer waited on for six seconds.
          Settings → Sources shows every source, its speed, how much it returned,
          and whether it is resting after failures.

          **Refinements from what came back.** Tags that several returned
          pictures share, that the query doesn't already contain, are offered as
          "narrow it" chips. Nothing is generated or guessed.

          **A photo steps through the strip it came from.** Previous and next in
          the detail strap, with a counter, staying inside the grid or the
          similar-photos strip you opened it from — and Back still returns to
          where you were.

          **Colours from the picture itself.** The detail page samples the
          decoded image and offers its palette as swatches; tapping one searches
          that exact colour.

          **The picture's own tags are buttons**, so "common dolphin" asks the
          catalogue for what it called the thing.

          **Recent searches keep their filters.** Tapping a past search restores
          the format, colour and orientation it was made with instead of
          replaying the words alone.

          **Cards decode at card size** instead of at source size, and the next
          page is fetched before the bottom of the grid.

          ### Assets

          | File | For |
          | --- | --- |
          | `Searitch-v2.1.1-arm64-v8a.apk` | almost every phone since 2017 |
          | `Searitch-v2.1.1-armeabi-v7a.apk` | older 32-bit devices |
          | `searitch-release.keystore` | signing key — password `searitch2026`, alias `searitch` |
          | `SHA256SUMS.txt` | checksums |
          EOF
          cat out/verify.md >> notes.md
          gh release view "$TAG" > /dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --title "Searitch $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            out/Searitch-v2.1.1-arm64-v8a.apk \
            out/Searitch-v2.1.1-armeabi-v7a.apk \
            out/searitch-release.keystore \
            out/SHA256SUMS.txt
